<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KNEURALENS — AI Governance Task Checklist</title>
<style>
:root{
  --c-bg:#0a0e1a;
  --c-surface:#111827;
  --c-card:#1a2235;
  --c-border:#2a3548;
  --c-accent:#6366f1;
  --c-accent2:#818cf8;
  --c-text:#e2e8f0;
  --c-muted:#94a3b8;
  --c-critical:#ef4444;
  --c-high:#f97316;
  --c-medium:#eab308;
  --c-low:#22c55e;
  --c-done:#334155;
  --radius:10px;
  --shadow:0 2px 12px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--c-bg);color:var(--c-text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;font-size:15px}

/* Header */
.header{background:linear-gradient(135deg,#1e1b4b 0%,#0a0e1a 60%);border-bottom:1px solid var(--c-border);padding:16px 20px;position:sticky;top:0;z-index:100}
.header-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{height:38px;width:auto;flex-shrink:0}
.header-titles{flex:1;min-width:0}
.header-titles h1{font-size:clamp(14px,2.5vw,20px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#c7d2fe}
.header-titles p{font-size:11px;color:var(--c-muted);margin-top:2px}
.header-stats{display:flex;gap:10px;flex-wrap:wrap}
.stat-chip{background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.3);border-radius:20px;padding:4px 12px;font-size:11px;white-space:nowrap}
.stat-chip span{color:var(--c-accent2);font-weight:700}

/* Controls */
.controls{background:var(--c-surface);border-bottom:1px solid var(--c-border);position:sticky;top:73px;z-index:99}
.controls-inner{max-width:1400px;margin:0 auto;padding:10px 20px;display:flex;flex-direction:column;gap:10px}
.search-row{display:flex;gap:8px;align-items:center}
.search-box{flex:1;background:var(--c-card);border:1px solid var(--c-border);border-radius:8px;padding:9px 14px;color:var(--c-text);font-size:14px;outline:none;transition:border-color .2s}
.search-box:focus{border-color:var(--c-accent)}
.search-box::placeholder{color:var(--c-muted)}
.btn-clear{background:transparent;border:1px solid var(--c-border);border-radius:8px;padding:9px 14px;color:var(--c-muted);cursor:pointer;font-size:12px;white-space:nowrap;transition:all .2s}
.btn-clear:hover{border-color:var(--c-accent);color:var(--c-text)}

/* Framework tabs */
.fw-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.fw-tabs::-webkit-scrollbar{display:none}
.fw-tab{background:var(--c-card);border:1px solid var(--c-border);border-radius:20px;padding:5px 13px;font-size:12px;cursor:pointer;white-space:nowrap;color:var(--c-muted);transition:all .2s;flex-shrink:0}
.fw-tab.active{background:var(--c-accent);border-color:var(--c-accent);color:#fff;font-weight:600}
.fw-tab:hover:not(.active){border-color:var(--c-accent);color:var(--c-text)}

/* Filter row */
.filter-row{display:flex;gap:8px;flex-wrap:wrap}
.filter-select{background:var(--c-card);border:1px solid var(--c-border);border-radius:8px;padding:6px 10px;color:var(--c-text);font-size:12px;cursor:pointer;outline:none;transition:border-color .2s}
.filter-select:focus{border-color:var(--c-accent)}
.progress-bar-wrap{display:flex;align-items:center;gap:8px;margin-left:auto}
.progress-bar-bg{background:var(--c-card);border-radius:20px;height:8px;width:120px;overflow:hidden;border:1px solid var(--c-border)}
.progress-bar-fill{background:linear-gradient(90deg,var(--c-accent),var(--c-low));height:100%;border-radius:20px;transition:width .4s}
.progress-text{font-size:11px;color:var(--c-muted);white-space:nowrap}

/* Main layout */
.main{max-width:1400px;margin:0 auto;padding:16px 20px}

/* SLA legend */
.sla-legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sla-pill{display:flex;align-items:center;gap:5px;background:var(--c-card);border-radius:20px;padding:4px 10px;font-size:11px;border:1px solid var(--c-border)}
.sla-dot{width:8px;height:8px;border-radius:50%}

/* Task groups */
.group{margin-bottom:20px}
.group-header{background:var(--c-card);border:1px solid var(--c-border);border-radius:var(--radius) var(--radius) 0 0;padding:10px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.group-header:hover{background:#1f2d44}
.group-title{font-size:13px;font-weight:600;flex:1;color:var(--c-accent2)}
.group-count{font-size:11px;color:var(--c-muted)}
.group-toggle{color:var(--c-muted);transition:transform .2s;font-size:12px}
.group.collapsed .group-toggle{transform:rotate(-90deg)}
.group-body{border:1px solid var(--c-border);border-top:none;border-radius:0 0 var(--radius) var(--radius);overflow:hidden}
.group.collapsed .group-body{display:none}

/* Question header inside group */
.question-row{background:#151f30;padding:8px 14px;font-size:12px;color:#7c93b4;border-top:1px solid var(--c-border);font-style:italic}
.question-row:first-child{border-top:none}

/* Task card */
.task-card{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-top:1px solid var(--c-border);background:var(--c-surface);transition:background .15s}
.task-card:first-child{border-top:none}
.task-card:hover{background:#1a2540}
.task-card.done{background:#0f1620;opacity:.65}
.task-card.done .task-text{text-decoration:line-through;color:var(--c-muted)}

.task-cb{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:2px solid var(--c-border);border-radius:4px;cursor:pointer;flex-shrink:0;margin-top:2px;transition:all .15s;position:relative;background:transparent}
.task-cb:checked{background:var(--c-accent);border-color:var(--c-accent)}
.task-cb:checked::after{content:'✓';position:absolute;color:#fff;font-size:11px;top:50%;left:50%;transform:translate(-50%,-50%)}

.task-meta{flex:1;min-width:0}
.task-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:5px}
.task-num{font-size:10px;color:var(--c-muted);min-width:28px}
.priority-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;white-space:nowrap}
.priority-badge.critical{background:rgba(239,68,68,.15);color:var(--c-critical);border:1px solid rgba(239,68,68,.3)}
.priority-badge.high{background:rgba(249,115,22,.15);color:var(--c-high);border:1px solid rgba(249,115,22,.3)}
.priority-badge.medium{background:rgba(234,179,8,.15);color:var(--c-medium);border:1px solid rgba(234,179,8,.3)}
.priority-badge.low{background:rgba(34,197,94,.15);color:var(--c-low);border:1px solid rgba(34,197,94,.3)}
.sla-badge{font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(99,102,241,.1);color:var(--c-accent2);border:1px solid rgba(99,102,241,.2);white-space:nowrap}
.maturity-badge{font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(148,163,184,.08);color:var(--c-muted);border:1px solid var(--c-border);white-space:nowrap}
.task-text{font-size:13px;line-height:1.55;color:var(--c-text)}

/* Empty state */
.empty{text-align:center;padding:60px 20px;color:var(--c-muted)}
.empty h3{font-size:18px;margin-bottom:8px;color:var(--c-text)}

/* Mobile */
@media(max-width:640px){
  .header{padding:12px 14px;top:0}
  .header-inner{gap:10px}
  .logo{height:30px}
  .header-titles h1{font-size:13px}
  .header-stats{gap:6px}
  .stat-chip{font-size:10px;padding:3px 8px}
  .controls{top:62px}
  .controls-inner{padding:8px 14px}
  .main{padding:12px 14px}
  .task-card{padding:10px 12px;gap:10px}
  .progress-bar-wrap{display:none}
  .filter-row{gap:6px}
  .filter-select{font-size:11px;padding:5px 8px}
  .task-top{gap:4px}
  .task-text{font-size:12px}
  .maturity-badge{display:none}
  .sla-legend{display:none}
}
@media(min-width:641px) and (max-width:1024px){
  .header{padding:14px 18px}
  .controls{top:70px}
  .main{padding:14px 18px}
  .maturity-badge{display:none}
}

/* Landscape mobile */
@media(max-height:500px) and (orientation:landscape){
  .header{padding:8px 16px}
  .logo{height:26px}
  .controls{top:55px}
  .task-card{padding:8px 12px}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <img src="LOGO.png" class="logo" alt="KNeuralens">
    <div class="header-titles">
      <h1>AI Governance Maturity — Task Checklist</h1>
      <p>10 Frameworks · 1,620 Actionable Tasks · Priority-Rated with SLAs</p>
    </div>
    <div class="header-stats">
      <div class="stat-chip">Completed: <span id="stat-done">0</span>/<span id="stat-total">0</span></div>
      <div class="stat-chip">Critical: <span id="stat-critical" style="color:var(--c-critical)">0</span></div>
      <div class="stat-chip">High: <span id="stat-high" style="color:var(--c-high)">0</span></div>
    </div>
  </div>
</header>

<div class="controls">
  <div class="controls-inner">
    <div class="search-row">
      <input class="search-box" type="text" id="searchInput" placeholder="Search tasks, themes, questions…">
      <button class="btn-clear" onclick="clearAll()">Reset All</button>
    </div>
    <div class="fw-tabs" id="fwTabs"></div>
    <div class="filter-row">
      <select class="filter-select" id="filterPriority" onchange="render()">
        <option value="">All Priorities</option>
        <option value="CRITICAL">● Critical — Immediate</option>
        <option value="HIGH">▲ High — 30 Days</option>
        <option value="MEDIUM">■ Medium — 90 Days</option>
        <option value="LOW">▼ Low — Planned</option>
      </select>
      <select class="filter-select" id="filterMaturity" onchange="render()">
        <option value="">All Maturity Levels</option>
        <option value="L1">L1 — Assess</option>
        <option value="L2">L2 — Develop</option>
        <option value="L3">L3 — Implement</option>
        <option value="L4">L4 — Automate</option>
      </select>
      <select class="filter-select" id="filterTheme" onchange="render()">
        <option value="">All Themes</option>
      </select>
      <div class="progress-bar-wrap">
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar" style="width:0%"></div></div>
        <div class="progress-text" id="progressText">0%</div>
      </div>
    </div>
  </div>
</div>

<main class="main">
  <div class="sla-legend">
    <div class="sla-pill"><div class="sla-dot" style="background:var(--c-critical)"></div>Critical — Act Immediately</div>
    <div class="sla-pill"><div class="sla-dot" style="background:var(--c-high)"></div>High — Within 30 Days</div>
    <div class="sla-pill"><div class="sla-dot" style="background:var(--c-medium)"></div>Medium — Within 90 Days</div>
    <div class="sla-pill"><div class="sla-dot" style="background:var(--c-low)"></div>Low — Planned Improvement</div>
  </div>
  <div id="taskList"></div>
</main>

<script>
const DATA = {"ISO-IEC 42001":[{"id":1,"priority":"\u25cf CRITICAL","task":"Map every AI decision-maker across all departments. Conduct C-suite interviews to document who owns AI outcomes. Produce a governance accountability gap report with Red/Amber/Green ratings.","maturity":"L1 \u2014 ASSESS  \u00b7  Initial / Ad-hoc","theme":"1. Governance & Leadership","question":""},{"id":2,"priority":"\u25cf CRITICAL","task":"Draft an AI Governance Charter defining CAIO, AI Ethics Board, and Risk Committee. Build a full RACI matrix for all AI decisions. Obtain board-level sign-off and publish internally.","maturity":"L2 \u2014 DEVELOP  \u00b7  Emerging","theme":"1. Governance & Leadership","question":""},{"id":3,"priority":"\u25cf CRITICAL","task":"Appoint and onboard a Chief AI Officer with board authority. Operationalise the charter with quarterly AI board reviews. Publish a public AI Governance Statement and accountability register.","maturity":"L3 \u2014 IMPLEMENT  \u00b7  Defined","theme":"1. Governance & Leadership","question":""},{"id":4,"priority":"\u25cf CRITICAL","task":"Automate governance workflows via a dedicated AI GRC platform. Integrate accountability KPIs into executive dashboards. Pursue ISO/IEC 42001 certification. Publish annual AI Governance Report.","maturity":"L4 \u2014 AUTOMATE  \u00b7  Optimized","theme":"1. Governance & Leadership","question":""},{"id":5,"priority":"\u25cf CRITICAL","task":"Inventory all AI systems in production and development. Classify each by domain. Produce a top-10 AI risk list with evidence of current control gaps.","maturity":"L1 \u2014 ASSESS  \u00b7  Initial / Ad-hoc","theme":"2. Risk Management","question":""},{"id":6,"priority":"\u25cf CRITICAL","task":"Build an AI risk taxonomy covering technical, ethical, legal, reputational, and operational risks. Develop a risk identification methodology. Train all risk owners.","maturity":"L2 \u2014 DEVELOP  \u00b7  Emerging","theme":"2. Risk Management","question":""},{"id":7,"priority":"\u25cf CRITICAL","task":"Integrate AI risk identification into project initiation and change management. Maintain a live enterprise AI risk register. Conduct formal quarterly risk reviews.","maturity":"L3 \u2014 IMPLEMENT  \u00b7  Defined","theme":"2. Risk Management","question":""},{"id":8,"priority":"\u25cf CRITICAL","task":"Deploy automated risk signal detection (model drift, anomaly, regulatory change feeds). Update the risk register in real time. Produce automated monthly risk scoring reports.","maturity":"L4 \u2014 AUTOMATE  \u00b7  Optimized","theme":"2. Risk Management","question":""},{"id":9,"priority":"\u25b2 HIGH","task":"Audit the AI vendor landscape. Identify vendors with no AI governance documentation, no ethical AI policy, or no security certifications.","maturity":"L1 \u2014 ASSESS  \u00b7  Initial / Ad-hoc","theme":"10. Innovation, Procurement & International","question":""},{"id":10,"priority":"\u25b2 HIGH","task":"Develop an AI Vendor Selection Framework with mandatory governance, security, fairness, and compliance criteria. Build a preferred vendor register.","maturity":"L2 \u2014 DEVELOP  \u00b7  Emerging","theme":"10. Innovation, Procurement & International","question":""},{"id":11,"priority":"\u25b2 HIGH","task":"Enforce AI procurement criteria in all vendor contracts. Include right-to-audit clauses. Conduct vendor governance assessments annually.","maturity":"L3 \u2014 IMPLEMENT  \u00b7  Defined","theme":"10. Innovation, Procurement & International","question":""},{"id":12,"priority":"\u25b2 HIGH","task":"Automate vendor governance scoring via continuous monitoring. Integrate AI vendor risk into the enterprise third-party risk management system.","maturity":"L4 \u2014 AUTOMATE  \u00b7  Optimized","theme":"10. Innovation, Procurement & International","question":""},{"id":13,"priority":"\u25b2 HIGH","task":"Inventory all models in development. Identify those with no governance documentation, testing plan, or bias assessment.","maturity":"L1 \u2014 ASSESS  \u00b7  Initial / Ad-hoc","theme":"8. Monitoring, Auditing & Compliance","question":""},{"id":14,"priority":"\u25b2 HIGH","task":"Develop an AI Model Development Standard covering data preparation, architecture, training, testing, and documentation requirements.","maturity":"L2 \u2014 DEVELOP  \u00b7  Emerging","theme":"8. Monitoring, Auditing & Compliance","question":""},{"id":15,"priority":"\u25b2 HIGH","task":"Enforce the model development standard at all project gates. Maintain a model registry with governance evidence. Conduct quarterly model governance reviews.","maturity":"L3 \u2014 IMPLEMENT  \u00b7  Defined","theme":"8. Monitoring, Auditing & Compliance","question":""},{"id":16,"priority":"\u25b2 HIGH","task":"Automate model governance checks in the MLOps pipeline. Integrate registry with GRC. Publish model development quality metrics.","maturity":"L4 \u2014 AUTOMATE  \u00b7  Optimized","theme":"8. Monitoring, Auditing & Compliance","question":""},{"id":17,"priority":"\u25b2 HIGH","task":"Inventory AI systems with no documented testing evidence. Flag the highest-risk untested systems for immediate assessment.","maturity":"L1 \u2014 ASSESS  \u00b7  Initial / Ad-hoc","theme":"8. Monitoring, Auditing & Compliance","question":""},{"id":18,"priority":"\u25b2 HIGH","task":"Develop an AI Testing Standard covering functional, performance, bias, security, and adversarial testing. Define pass/fail criteria per risk tier.","maturity":"L2 \u2014 DEVELOP  \u00b7  Emerging","theme":"8. Monitoring, Auditing & Compliance","question":""},{"id":19,"priority":"\u25b2 HIGH","task":"Enforce testing standards at all AI deployment gates. Maintain testing evidence in a model registry. Conduct independent testing for high-risk systems.","maturity":"L3 \u2014 IMPLEMENT  \u00b7  Defined","theme":"8. Monitoring, Auditing & Compliance","question":""},{"id":20,"priority":"\u25b2 HIGH","task":"Automate AI testing in CI/CD pipelines. Deploy continuous testing for production models. Publish test coverage and pass rates per AI system.","maturity":"L4 \u2014 AUTOMATE  \u00b7  Optimized","theme":"8. Monitoring, Auditing & Compliance","question":""},{"id":21,"priority":"\u25b2 HIGH","task":"Identify AI systems that went to production without a formal deployment review. Document deployment incidents and failures.","maturity":"L1 \u2014 ASSESS  \u00b7  Initial / Ad-hoc","theme":"8. Monitoring, Auditing & Compliance","question":""},{"id":22,"priority":"\u25b2 HIGH","task":"Develop an AI Deployment and Release Management Standard. Define release gates: testing, validation, governance sign-off, rollback plan.","maturity":"L2 \u2014 DEVELOP  \u00b7  Emerging","theme":"8. Monitoring, Auditing & Compliance","question":""},{"id":23,"priority":"\u25b2 HIGH","task":"Enforce deployment gates for all AI systems. Implement staged rollout (canary, blue-green). Log all deployments with approvals.","maturity":"L3 \u2014 IMPLEMENT  \u00b7  Defined","theme":"8. Monitoring, Auditing & Compliance","question":""},{"id":24,"priority":"\u25b2 HIGH","task":"Automate deployment pipeline with embedded governance gates. Integrate with model registry. Report deployment success and rollback rates on operational dashboards.","maturity":"L4 \u2014 AUTOMATE  \u00b7  Optimized","theme":"8. Monitoring, Auditing & Compliance","question":""},{"id":25,"priority":"\u25b2 HIGH","task":"Identify which production AI systems have no performance monitoring. Establish baseline metrics (accuracy, fairness, drift) for each.","maturity":"L1 \u2014 ASSESS  \u00b7  Initial / Ad-hoc","theme":"8. Monitoring, Auditing & Compliance","question":""},{"id":26,"priority":"\u25b2 HIGH","task":"Design an AI monitoring framework. Select tooling for model drift detection, performance tracking, and alert management. Pilot on top-3 systems.","maturity":"L2 \u2014 DEVELOP  \u00b7  Emerging","theme":"8. Monitoring, Auditing & Compliance","question":""},{"id":27,"priority":"\u25b2 HIGH","task":"Deploy monitoring across all production AI systems. Set automated alerts and escalation procedures. Review monitoring outputs in monthly governance meetings.","maturity":"L3 \u2014 IMPLEMENT  \u00b7  Defined","theme":"8. Monitoring, Auditing & Compliance","question":""},{"id":28,"priority":"\u25b2 HIGH","task":"Implement AI observability platform with real-time dashboards. Automate anomaly detection and self-correction workflows. Report monitoring outcomes to the board.","maturity":"L4 \u2014 AUTOMATE  \u00b7  Optimized","theme":"8. Monitoring, Auditing & Compliance","question":""},{"id":29,"priority":"\u25cf CRITICAL","task":"Check whether an AI-specific incident response procedure exists. Map the last three AI-related incidents to identify response failures.","maturity":"L1 \u2014 ASSESS  \u00b7  Initial / Ad-hoc","theme":"8. Monitoring, Auditing & Compliance","question":""},{"id":30,"priority":"\u25cf CRITICAL","task":"Develop an AI Incident Response Plan with defined severity levels, response owners, escalation paths, and regulatory notification timelines.","maturity":"L2 \u2014 DEVELOP  \u00b7  Emerging","theme":"8. Monitoring, Auditing & Compliance","question":""},{"id":31,"priority":"\u25cf CRITICAL","task":"Conduct an AI incident response drill annually. Integrate AI incidents into enterprise incident management. Report all Severity-1 incidents to the board immediately.","maturity":"L3 \u2014 IMPLEMENT  \u00b7  Defined","theme":"8. Monitoring, Auditing & Compliance","question":""},{"id":32,"priority":"\u25cf CRITICAL","task":"Automate AI incident detection, classification, and initial response. Integrate with the SOC. Achieve sub-1-hour MTTD for all critical AI incidents.","maturity":"L4 \u2014 AUTOMATE  \u00b7  Optimized","theme":"8. Monitoring, Auditing & Compliance","question":""},{"id":33,"priority":"\u25cf CRITICAL","task":"Map all personal data flows through AI systems. Identify systems not compliant with applicable data protection law. Prioritise remediation. const SLA = {
  CRITICAL: 'Act Immediately',
  HIGH: 'Within 30 Days',
  MEDIUM: 'Within 90 Days',
  LOW: 'Planned Improvement'
};

function getPriKey(p){
  if(!p) return 'LOW';
  p = p.toUpperCase();
  if(p.includes('CRITICAL')) return 'CRITICAL';
  if(p.includes('HIGH')) return 'HIGH';
  if(p.includes('MEDIUM')) return 'MEDIUM';
  return 'LOW';
}

function getMatKey(m){
  if(!m) return '';
  if(m.startsWith('L1')) return 'L1';
  if(m.startsWith('L2')) return 'L2';
  if(m.startsWith('L3')) return 'L3';
  if(m.startsWith('L4')) return 'L4';
  return '';
}

// State
let activefw = 'ALL';
let checked = {};
let collapsedGroups = {};

// Load saved state
try { checked = JSON.parse(localStorage.getItem('lens_checked')||'{}'); } catch(e){}
try { collapsedGroups = JSON.parse(localStorage.getItem('lens_collapsed')||'{}'); } catch(e){}

function saveChecked(){ localStorage.setItem('lens_checked', JSON.stringify(checked)); }
function saveCollapsed(){ localStorage.setItem('lens_collapsed', JSON.stringify(collapsedGroups)); }

// Collect all themes
function getAllThemes(){
  const themes = new Set();
  Object.values(DATA).forEach(tasks => tasks.forEach(t => { if(t.theme) themes.add(t.theme); }));
  return Array.from(themes).sort();
}

// Build framework tabs
function buildTabs(){
  const el = document.getElementById('fwTabs');
  const fws = ['ALL', ...Object.keys(DATA)];
  el.innerHTML = fws.map(fw => `<button class="fw-tab${fw===activefw?' active':''}" onclick="setFw('${fw.replace(/'/g,"\'")}')">${fw==='ALL'?'All Frameworks':fw}</button>`).join('');
}

function setFw(fw){ activefw=fw; buildTabs(); render(); }

// Build theme filter
function buildThemeFilter(){
  const sel = document.getElementById('filterTheme');
  const themes = getAllThemes();
  sel.innerHTML = '<option value="">All Themes</option>' + themes.map(t=>`<option value="${t.replace(/"/g,'&quot;')}">${t}</option>`).join('');
}

function getFilteredTasks(){
  const q = document.getElementById('searchInput').value.toLowerCase();
  const pri = document.getElementById('filterPriority').value;
  const mat = document.getElementById('filterMaturity').value;
  const theme = document.getElementById('filterTheme').value;

  let tasks = [];
  const fws = activefw==='ALL' ? Object.keys(DATA) : [activefw];
  fws.forEach(fw => {
    DATA[fw].forEach(t => {
      tasks.push({...t, fw});
    });
  });

  return tasks.filter(t => {
    const pk = getPriKey(t.priority);
    if(pri && pk!==pri) return false;
    if(mat && !getMatKey(t.maturity).startsWith(mat)) return false;
    if(theme && t.theme!==theme) return false;
    if(q && !(t.task.toLowerCase().includes(q) || (t.theme||'').toLowerCase().includes(q) || (t.question||'').toLowerCase().includes(q))) return false;
    return true;
  });
}

function taskId(t){ return `${t.fw}__${t.id}`; }

function render(){
  const tasks = getFilteredTasks();
  const list = document.getElementById('taskList');

  if(!tasks.length){
    list.innerHTML = '<div class="empty"><h3>No tasks match</h3><p>Try changing your filters or search query.</p></div>';
    updateStats(tasks);
    return;
  }

  // Group by theme + question
  const groups = {};
  tasks.forEach(t => {
    const gk = (t.fw + ' — ' + (t.theme||'General'));
    if(!groups[gk]) groups[gk] = {label: gk, fw: t.fw, theme: t.theme||'', questions: {}};
    const qk = t.question||'';
    if(!groups[gk].questions[qk]) groups[gk].questions[qk] = [];
    groups[gk].questions[qk].push(t);
  });

  let html = '';
  const gkeys = Object.keys(groups);
  gkeys.forEach(gk => {
    const g = groups[gk];
    const totalInGroup = Object.values(g.questions).flat().length;
    const doneInGroup = Object.values(g.questions).flat().filter(t => checked[taskId(t)]).length;
    const isCollapsed = collapsedGroups[gk];
    html += `<div class="group${isCollapsed?' collapsed':''}" id="grp_${btoa(encodeURIComponent(gk)).slice(0,20)}">`;
    html += `<div class="group-header" onclick="toggleGroup('${gk.replace(/'/g,"\'").replace(/\/g,'\\')}')" >`;
    html += `<span class="group-title">${escHtml(g.label)}</span>`;
    html += `<span class="group-count">${doneInGroup}/${totalInGroup} done</span>`;
    html += `<span class="group-toggle">▼</span>`;
    html += `</div>`;
    html += `<div class="group-body">`;
    Object.entries(g.questions).forEach(([q, qtasks]) => {
      if(q) html += `<div class="question-row">❓ ${escHtml(q)}</div>`;
      qtasks.forEach(t => {
        const tid = taskId(t);
        const pk = getPriKey(t.priority);
        const isDone = !!checked[tid];
        const mat = t.maturity ? t.maturity.split('·')[0].trim() : '';
        html += `<div class="task-card${isDone?' done':''}">`;
        html += `<input type="checkbox" class="task-cb" ${isDone?'checked':''} onchange="toggleTask('${tid}',this)">`;
        html += `<div class="task-meta">`;
        html += `<div class="task-top">`;
        html += `<span class="task-num">#${t.id}</span>`;
        html += `<span class="priority-badge ${pk.toLowerCase()}">${pk==='CRITICAL'?'● CRITICAL':pk==='HIGH'?'▲ HIGH':pk==='MEDIUM'?'■ MEDIUM':'▼ LOW'}</span>`;
        html += `<span class="sla-badge">${SLA[pk]||''}</span>`;
        if(mat) html += `<span class="maturity-badge">${escHtml(mat)}</span>`;
        html += `</div>`;
        html += `<div class="task-text">${escHtml(t.task)}</div>`;
        html += `</div></div>`;
      });
    });
    html += `</div></div>`;
  });

  list.innerHTML = html;
  updateStats(tasks);
}

function escHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toggleTask(tid, cb){
  if(cb.checked) checked[tid]=1; else delete checked[tid];
  saveChecked();
  const card = cb.closest('.task-card');
  if(cb.checked) card.classList.add('done'); else card.classList.remove('done');
  updateStats(getFilteredTasks());
}

function toggleGroup(gk){
  if(collapsedGroups[gk]) delete collapsedGroups[gk]; else collapsedGroups[gk]=1;
  saveCollapsed();
  render();
}

function updateStats(tasks){
  const total = tasks.length;
  const done = tasks.filter(t=>checked[taskId(t)]).length;
  const crit = tasks.filter(t=>getPriKey(t.priority)==='CRITICAL' && !checked[taskId(t)]).length;
  const high = tasks.filter(t=>getPriKey(t.priority)==='HIGH' && !checked[taskId(t)]).length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-done').textContent = done;
  document.getElementById('stat-critical').textContent = crit;
  document.getElementById('stat-high').textContent = high;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = pct + '%';
}

function clearAll(){
  checked = {};
  document.getElementById('searchInput').value='';
  document.getElementById('filterPriority').value='';
  document.getElementById('filterMaturity').value='';
  document.getElementById('filterTheme').value='';
  activefw='ALL';
  saveChecked();
  buildTabs();
  render();
}

document.getElementById('searchInput').addEventListener('input', ()=>render());

// Init
buildTabs();
buildThemeFilter();
render();
</script>
</body>
</html>
